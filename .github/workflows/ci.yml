name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # gpui compiles its Metal shaders at build time; Xcode 26+ ships the
      # Metal toolchain as a separate download.
      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      # Debug builds load gpui's shaders from the build machine's source tree
      # at runtime, so this binary only works on the runner. Use the Release
      # workflow (run manually) for a binary to try out.
      - uses: actions/upload-artifact@v4
        with:
          name: fec-viewer-debug-${{ runner.os }}
          path: |
            target/debug/fec-viewer
            target/debug/fec-viewer.exe
          if-no-files-found: error
          retention-days: 7
