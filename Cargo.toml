[package]
name = "fec-viewer"
version = "0.0.1-alpha.2"
edition = "2024"
publish = false

[dependencies]
fec-parser = { path = "/Users/alex/projects/libfec-wt/typed-covers/crates/fec-parser" }  # TEMP: switch to git branch typed-covers once pushed
gpui-kit = "0.7.0"
anyhow = "1"
jiff = "0.2"
csv = "1.2.2"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

# Browser demo (see README): `make -C web serve`.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Response",
    "UrlSearchParams",
    "Window",
] }

# macOS app bundle: `cargo bundle --release` (cargo-bundle 0.12+).
[package.metadata.bundle]
name = "FEC Viewer"
identifier = "dev.libfec.fec-viewer"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"
info_plist_exts = ["packaging/macos/DocumentTypes.plist"]

[profile.release]
lto = "thin"
