[package]
name = "fec-viewer"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
fec-parser = { git = "https://github.com/asg017/libfec", rev = "a1660e5782f62ed285ba5880070a6ae82a626c4e" }  # branch fec-parser-byte-offset
gpui-kit = "0.7.0"
anyhow = "1"
csv = "1.2.2"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

# Browser demo (see README): `make -C web serve`.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Response",
    "UrlSearchParams",
    "Window",
] }

[profile.release]
lto = "thin"
