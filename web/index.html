<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FEC Viewer</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #0a0a0a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; } }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
      body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      /* gpui_web appends its canvas to <body>. */
      body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; pointer-events: none; }
      #status.error { color: #d32f2f; }
    </style>
  </head>
  <body>
    <div id="status">Loading FEC Viewer…</div>
    <script type="module">
      // All of the app is Rust: this only fetches and starts the wasm module,
      // whose `main` opens the gpui window.
      import init from "./fec-viewer.js";
      const status = document.getElementById("status");
      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.className = "error";
        status.textContent =
          "FEC Viewer failed to start: " + (error.message || error) +
          ". It needs a browser with WebGPU or WebGL2.";
      }
    </script>
  </body>
</html>
